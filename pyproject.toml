[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc_planner"
version = "0.1.0"
description = "Prefrontal cortex trajectory planner with GLE"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "structlog",
    "Pillow",
    "minjerk-dynamics",
    "matplotlib",
]

[project.optional-dependencies]
notebook = ["jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]
