[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc_planner"
version = "0.1.0"
description = "Prefrontal cortex trajectory planner with GLE"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "structlog",
    "Pillow",
]

[project.optional-dependencies]
standalone = [
    "minjerk-dynamics @ git+https://github.com/near-nes/controller.git#subdirectory=complete_control/shared/minjerk",
]

[tool.setuptools.packages.find]
where = ["src"]
